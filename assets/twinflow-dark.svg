<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-labelledby="t d">
  <title id="t">twinflow, a warehouse digital twin</title>
  <desc id="d">twinflow, version 0.1.0, phase 1 in progress. A warehouse digital twin that answers what-if questions with a statistical verdict. In the OT segment, Purdue levels 0 to 2, a discrete-event model of receiving and putaway drives a simulated MQTT device fleet. A broker bridge is the only path to the IT segment, Purdue levels 3 to 4, where a Lean Six Sigma engine judges the telemetry and a what-if agent returns a statistical verdict.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#9198a1" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="447" rx="12" fill="#151b23" stroke="#3d444d"/>
  <text x="32" y="46" class="mono" font-size="15" fill="#2dd4bf">v0.1.0, phase 1 in progress</text>
  <text x="30" y="96" class="sans" font-size="42" font-weight="700" letter-spacing="-0.5" fill="#e6edf3">twinflow</text>
  <text class="sans" font-size="21" fill="#9198a1">
    <tspan x="32" y="134">A warehouse digital twin that answers what-if</tspan>
    <tspan x="32" y="162">questions with a statistical verdict.</tspan>
  </text>

  <rect x="24" y="214" width="262" height="206" rx="10" fill="none" stroke="#3d444d" stroke-dasharray="5 5"/>
  <text x="40" y="204" class="mono" font-size="14" fill="#9198a1">OT, Purdue L0 to L2</text>
  <rect x="40" y="238" width="230" height="66" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <text x="56" y="267" class="sans" font-size="18" font-weight="600" fill="#e6edf3">Discrete-event model</text>
  <text x="56" y="289" class="mono" font-size="14" fill="#9198a1">receiving, putaway</text>
  <rect x="40" y="330" width="230" height="66" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <text x="56" y="359" class="sans" font-size="18" font-weight="600" fill="#e6edf3">Device fleet</text>
  <text x="56" y="381" class="mono" font-size="14" fill="#9198a1">simulated, MQTT</text>
  <line x1="155" y1="304" x2="155" y2="327" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="434" y="214" width="262" height="206" rx="10" fill="none" stroke="#3d444d" stroke-dasharray="5 5"/>
  <text x="450" y="204" class="mono" font-size="14" fill="#9198a1">IT, Purdue L3 to L4</text>
  <rect x="450" y="238" width="230" height="66" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <text x="466" y="267" class="sans" font-size="18" font-weight="600" fill="#e6edf3">What-if agent</text>
  <text x="466" y="289" class="mono" font-size="14" fill="#9198a1">statistical verdict</text>
  <rect x="450" y="330" width="230" height="66" rx="8" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
  <text x="466" y="359" class="sans" font-size="18" font-weight="600" fill="#e6edf3">Lean Six Sigma engine</text>
  <text x="466" y="381" class="mono" font-size="14" fill="#9198a1">judges telemetry</text>
  <line x1="565" y1="330" x2="565" y2="307" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="270" y1="363" x2="447" y2="363" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="294" y="346" width="132" height="34" rx="17" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="360" y="368" class="mono" font-size="13" text-anchor="middle" fill="#2dd4bf">broker bridge</text>
  <text x="360" y="403" class="sans" font-size="14" text-anchor="middle" fill="#9198a1">only OT to IT path</text>
</svg>
