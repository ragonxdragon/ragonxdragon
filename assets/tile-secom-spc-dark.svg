<svg xmlns="http://www.w3.org/2000/svg" width="268" height="252" viewBox="0 0 268 252" role="img" aria-labelledby="t d">
  <title id="t">secom-spc</title>
  <desc id="d">Statistical process control on UCI SECOM semiconductor data. The fail predictor's PR-AUC is 0.085 with a 95% interval of 0.052 to 0.167, which reaches below the 0.055 no-skill baseline, so it does not clearly beat chance.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="267" height="251" rx="12" fill="#151b23" stroke="#3d444d"/>
  <text x="20" y="40" class="sans" font-size="20" font-weight="700" fill="#e6edf3">secom-spc</text>
  <text class="sans" font-size="14" fill="#9198a1">
    <tspan x="20" y="64">SPC on semiconductor fab</tspan>
    <tspan x="20" y="83">data, UCI SECOM</tspan>
  </text>
  <line x1="89.7" y1="120" x2="89.7" y2="178" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="83.7" y="144" class="mono" font-size="12.5" text-anchor="end" fill="#9198a1">no skill</text>
  <line x1="85.9" y1="160" x2="231.5" y2="160" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="85.9" y1="154" x2="85.9" y2="166" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="231.5" y1="154" x2="231.5" y2="166" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="127.7" cy="160" r="6" fill="#2dd4bf"/>
  <text x="129.7" y="144" class="mono" font-size="12.5" fill="#e6edf3">fail predictor</text>
  <line x1="20" y1="178" x2="248" y2="178" stroke="#3d444d"/>
  <line x1="20.0" y1="178" x2="20.0" y2="183" stroke="#9198a1"/>
  <text x="20.0" y="199" class="mono" font-size="12" text-anchor="start" fill="#9198a1">0.00</text>
  <line x1="83.3" y1="178" x2="83.3" y2="183" stroke="#9198a1"/>
  <text x="83.3" y="199" class="mono" font-size="12" text-anchor="middle" fill="#9198a1">0.05</text>
  <line x1="146.7" y1="178" x2="146.7" y2="183" stroke="#9198a1"/>
  <text x="146.7" y="199" class="mono" font-size="12" text-anchor="middle" fill="#9198a1">0.10</text>
  <line x1="210.0" y1="178" x2="210.0" y2="183" stroke="#9198a1"/>
  <text x="210.0" y="199" class="mono" font-size="12" text-anchor="middle" fill="#9198a1">0.15</text>
  <text x="20" y="232" class="mono" font-size="12.5" fill="#9198a1">PR-AUC, 95% CI: no clear win</text>
</svg>
