<svg xmlns="http://www.w3.org/2000/svg" width="268" height="252" viewBox="0 0 268 252" role="img" aria-labelledby="t d">
  <title id="t">sparkplug-pipeline</title>
  <desc id="d">Sparkplug B over MQTT into TimescaleDB. Four ingest runs on a laptop at 3,242, 3,959, 4,451 and 4,675 messages per second, median 4,205.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="267" height="251" rx="12" fill="#151b23" stroke="#3d444d"/>
  <text x="20" y="40" class="sans" font-size="20" font-weight="700" fill="#e6edf3">sparkplug-pipeline</text>
  <text class="sans" font-size="14" fill="#9198a1">
    <tspan x="20" y="64">Sparkplug B over MQTT</tspan>
    <tspan x="20" y="83">into TimescaleDB</tspan>
  </text>
  <line x1="157.4" y1="126" x2="157.4" y2="178" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="151.4" y="136" class="mono" font-size="13" text-anchor="end" fill="#e6edf3">median 4,205</text>
  <line x1="20" y1="178" x2="248" y2="178" stroke="#3d444d"/>
  <circle cx="47.6" cy="164" r="6" fill="#2dd4bf" fill-opacity="0.85"/>
  <circle cx="211.0" cy="164" r="6" fill="#2dd4bf" fill-opacity="0.85"/>
  <circle cx="129.3" cy="164" r="6" fill="#2dd4bf" fill-opacity="0.85"/>
  <circle cx="185.4" cy="164" r="6" fill="#2dd4bf" fill-opacity="0.85"/>
  <line x1="20.0" y1="178" x2="20.0" y2="183" stroke="#9198a1"/>
  <text x="20.0" y="199" class="mono" font-size="12" text-anchor="start" fill="#9198a1">3,000</text>
  <line x1="134.0" y1="178" x2="134.0" y2="183" stroke="#9198a1"/>
  <text x="134.0" y="199" class="mono" font-size="12" text-anchor="middle" fill="#9198a1">4,000</text>
  <line x1="248.0" y1="178" x2="248.0" y2="183" stroke="#9198a1"/>
  <text x="248.0" y="199" class="mono" font-size="12" text-anchor="end" fill="#9198a1">5,000</text>
  <text x="20" y="232" class="mono" font-size="12.5" fill="#9198a1">msg/s ingest, 4 runs, laptop</text>
</svg>
