  <title id="t">Jack Hall</title>
  <desc id="d">Embedded systems, industrial data, and process improvement. Firmware that stays connected, and the systems that read it. Open to contract and full-time roles. A signal trace runs inside a control band; one reading crosses the upper limit and is flagged.</desc>
