<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Jack Hall, IoT and embedded systems engineer</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .packet { animation: travel 4.8s linear infinite; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(436px); } }
    @media (prefers-reduced-motion: reduce) { .packet { animation: none; opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="56" y="92" class="mono" font-size="15" letter-spacing="2.5" fill="#0f766e">EMBEDDED  /  IOT  /  INDUSTRIAL DATA</text>
  <text x="54" y="160" class="sans" font-size="64" font-weight="700" fill="#1f2328">Jack Hall</text>
  <text x="56" y="206" class="sans" font-size="22" fill="#59636e">Firmware that stays connected, and the systems that read it.</text>
  <text x="56" y="246" class="mono" font-size="15" fill="#59636e">C/C++  ·  Python  ·  ESP32  ·  LTE  ·  MQTT  ·  Azure IoT</text>

  <!-- signal path: the line runs behind the nodes, so the packet shows only between them -->
  <line x1="712" y1="150" x2="1148" y2="150" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 6"/>
  <circle class="packet" cx="712" cy="150" r="4.5" fill="#0f766e"/>

  <g class="mono" text-anchor="middle">
    <rect x="712" y="128" width="88" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="756" y="155" font-size="15" fill="#1f2328">tag</text>
    <text x="756" y="198" font-size="13" fill="#59636e">RFID</text>

    <rect x="828" y="128" width="88" height="44" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="872" y="155" font-size="15" fill="#0f766e">gateway</text>
    <text x="872" y="198" font-size="13" fill="#59636e">ESP32 + LTE</text>

    <rect x="944" y="128" width="88" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="988" y="155" font-size="15" fill="#1f2328">broker</text>
    <text x="988" y="198" font-size="13" fill="#59636e">MQTT</text>

    <rect x="1060" y="128" width="88" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="1104" y="155" font-size="15" fill="#1f2328">cloud</text>
    <text x="1104" y="198" font-size="13" fill="#59636e">IoT Hub</text>
  </g>
</svg>
